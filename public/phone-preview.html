<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MealPrep · Anteprima telefono</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #e8e9e5; font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; padding: 24px 12px; gap: 16px; }
    header { color: #424940; font-size: 13px; text-align: center; }
    header strong { display: block; font-size: 17px; margin-bottom: 4px; }
    .stage { position: relative; flex-shrink: 0; }
    .phone { position: relative; width: 418px; height: 930px; padding: 12px; background: #171918; border: 2px solid #777c79; border-radius: 56px; box-shadow: inset 0 0 0 3px #373b38, 0 18px 55px #18201840; transform-origin: top left; }
    .screen { overflow: hidden; border-radius: 40px; background: #fcfff9; height: 898px; }
    .status { height: 36px; position: relative; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; font-size: 12px; font-weight: 600; color: #20231f; }
    .camera { position: absolute; top: 7px; left: 50%; transform: translateX(-50%); width: 100px; height: 24px; border-radius: 20px; background: #111; }
    .camera::after { content: ''; position: absolute; right: 12px; top: 8px; width: 8px; height: 8px; border-radius: 50%; background: #192e40; box-shadow: inset 0 0 2px #4f6378; }
    .battery { width: 21px; height: 10px; border: 1px solid #20231f; border-radius: 3px; padding: 1px; }
    .battery::after { content: ''; display: block; height: 100%; background: #20231f; border-radius: 1px; }
    iframe { display: block; width: 390px; height: 844px; border: 0; background: white; }
    .home { height: 18px; display: flex; justify-content: center; align-items: center; }
    .home::after { content: ''; width: 130px; height: 5px; border-radius: 4px; background: #20231f; }
    .key { position: absolute; width: 4px; background: #555b57; border-radius: 3px; left: -5px; }
    .mute { top: 110px; height: 24px; } .up { top: 158px; height: 52px; } .down { top: 224px; height: 52px; }
    .power { left: auto; right: -5px; top: 177px; height: 78px; }
  </style>
</head>
<body>
  <header><strong>MealPrep</strong>Anteprima telefono · 390 × 844 · Navigazione interattiva</header>
  <main class="stage" aria-label="Anteprima smartphone">
    <div class="phone">
      <span class="key mute" aria-hidden="true"></span><span class="key up" aria-hidden="true"></span><span class="key down" aria-hidden="true"></span><span class="key power" aria-hidden="true"></span>
      <div class="screen">
        <div class="status" aria-hidden="true"><span>9:41</span><span class="camera"></span><span class="battery"></span></div>
        <iframe src="/" title="MealPrep in formato telefono"></iframe>
        <div class="home" aria-hidden="true"></div>
      </div>
    </div>
  </main>
  <script>
    function fitPhone() {
      const stage = document.querySelector('.stage');
      const scale = Math.max(0.1, Math.min(1, (window.innerWidth - 40) / 418, (window.innerHeight - 108) / 930));
      stage.style.width = `${418 * scale}px`;
      stage.style.height = `${930 * scale}px`;
      document.querySelector('.phone').style.transform = `scale(${scale})`;
    }
    window.addEventListener('resize', fitPhone);
    fitPhone();
  </script>
</body>
</html>
